description = '''
Client-side key that sends sophisticatedcore:transfer_full_slot for the open backpack's filter slots.
Against an unpatched Sophisticated Core it turns a filter sample into a real item (+1 per send).
K = one send per filter slot, Shift+K = repeat, Ctrl+K = plant the clipboard item id as a ghost sample and take it.
'''

