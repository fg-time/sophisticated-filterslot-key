org.gradle.jvmargs=-Xmx3G -Djava.net.preferIPv4Stack=true
org.gradle.daemon=false

# Every outbound connection of this machine goes through the local proxy; Java does not read the
# Windows Internet Settings, so it has to be told explicitly (the neoforge maven edge IP is otherwise
# unreachable and the build hangs in SYN_SENT for half an hour).
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890
systemProp.http.nonProxyHosts=localhost|127.*|[::1]
systemProp.org.gradle.internal.http.connectionTimeout=20000
systemProp.org.gradle.internal.http.socketTimeout=120000
